<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 8px;
            color: #1a1a2e;
        }

        h2 {
            margin-bottom: 20px;
            color: #16213e;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            background: #4a6cf7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        button:hover {
            background: #3a5ce0;
        }

        button.danger {
            background: #f56565;
        }

        button.danger:hover {
            background: #e53e3e;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f7fafc;
            font-weight: 600;
            color: #2d3748;
        }

        .pagination {
            display: flex;
            gap: 8px;
            margin-top: 24px;
            justify-content: center;
        }

        .page-btn {
            background: white;
            border: 1px solid #e2e8f0;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn:hover {
            background: #4a6cf7;
            color: white;
            border-color: #4a6cf7;
        }

        .page-btn.active {
            background: #4a6cf7;
            color: white;
            border-color: #4a6cf7;
        }

        .alert {
            position: fixed;
            top: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .alert-success {
            background: #48bb78;
        }

        .alert-error {
            background: #f56565;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .stats {
            margin-bottom: 16px;
            color: #718096;
            font-size: 14px;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .two-columns {
                grid-template-columns: 1fr;
            }
        }

        .delete-btn {
            background: #f56565;
            padding: 4px 12px;
            font-size: 12px;
        }

        .delete-btn:hover {
            background: #e53e3e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>👥 User Center</h1>
            <p style="color: #718096;">Управление пользователями | FastAPI + PostgreSQL</p>
        </div>

        <div class="two-columns">
            <div class="card">
                <h2>➕ Добавить пользователя</h2>
                <form id="addForm">
                    <div class="form-group">
                        <label>Имя</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label>Возраст</label>
                        <input type="number" id="age" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <button type="submit">➕ Добавить</button>
                </form>
            </div>

            <div class="card">
                <h2>🔐 Админ-панель</h2>
                <div class="form-group">
                    <label>Админ-пароль</label>
                    <input type="password" id="adminPassword" placeholder="Введите пароль">
                </div>
                <button onclick="clearAll()" class="danger">🗑️ Очистить всех пользователей</button>
            </div>
        </div>

        <div class="card">
            <h2>📋 Список пользователей</h2>
            <div class="stats">
                <span id="stats"></span>
                <div>
                    <label style="display: inline; margin-right: 8px;">Показывать:</label>
                    <select id="limitSelect" style="width: auto;">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                    </select>
                </div>
            </div>
            <div id="usersList"></div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let currentLimit = 10;

        async function loadUsers() {
            try {
                const res = await fetch(`/users?limit=${currentLimit}&page=${currentPage}`);
                const data = await res.json();
                
                if (data.success) {
                    renderUsers(data.data);
                    renderPagination(data);
                    document.getElementById('stats').innerHTML = `📊 Всего: ${data.total} пользователей | Страница ${data.page} из ${data.total_pages}`;
                } else {
                    document.getElementById('usersList').innerHTML = '<p>Нет пользователей</p>';
                }
            } catch (e) {
                document.getElementById('usersList').innerHTML = '<p>Ошибка загрузки</p>';
            }
        }

        function renderUsers(users) {
            if (!users || users.length === 0) {
                document.getElementById('usersList').innerHTML = '<p>Нет пользователей</p>';
                return;
            }

            let html = '<table><thead><tr><th>ID</th><th>Имя</th><th>Возраст</th><th>Email</th><th>Действия</th></tr></thead><tbody>';
            users.forEach(user => {
                html += `
                    <tr>
                        <td>${user.id}</td>
                        <td>${escapeHtml(user.name)}</td>
                        <td>${user.age}</td>
                        <td>${escapeHtml(user.email)}</td>
                        <td><button class="delete-btn" onclick="deleteUser(${user.id})">Удалить</button></td>
                    </tr>
                `;
            });
            html += '</tbody></table>';
            document.getElementById('usersList').innerHTML = html;
        }

        function renderPagination(data) {
            if (data.total_pages <= 1) {
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            let html = '';
            for (let i = 1; i <= Math.min(data.total_pages, 10); i++) {
                html += `<div class="page-btn ${i === data.page ? 'active' : ''}" onclick="goToPage(${i})">${i}</div>`;
            }
            document.getElementById('pagination').innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            loadUsers();
        }

        async function addUser(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            const age = parseInt(document.getElementById('age').value);
            const email = document.getElementById('email').value;

            try {
                const res = await fetch('/add_user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, age, email })
                });
                
                if (res.ok) {
                    showAlert('✅ Пользователь добавлен!', 'success');
                    document.getElementById('addForm').reset();
                    loadUsers();
                } else {
                    const data = await res.json();
                    showAlert(data.detail || 'Ошибка добавления', 'error');
                }
            } catch (e) {
                showAlert('Ошибка сети', 'error');
            }
        }

        async function deleteUser(id) {
            const password = document.getElementById('adminPassword').value;
            
            if (!password) {
                showAlert('❌ Введите админ-пароль', 'error');
                return;
            }

            if (!confirm(`Удалить пользователя ID ${id}?`)) return;

            try {
                const res = await fetch('/delete_user', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, password: password })
                });
                
                if (res.ok) {
                    showAlert('✅ Пользователь удалён!', 'success');
                    loadUsers();
                } else {
                    const data = await res.json();
                    showAlert(data.detail || 'Ошибка удаления', 'error');
                }
            } catch (e) {
                showAlert('Ошибка сети: ' + e.message, 'error');
            }
        }

        async function clearAll() {
            const password = document.getElementById('adminPassword').value;
            
            if (!password) {
                showAlert('❌ Введите админ-пароль', 'error');
                return;
            }

            if (!confirm('⚠️ Очистить всех пользователей? Это действие необратимо!')) return;

            try {
                const res = await fetch('/clear', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password })
                });
                
                if (res.ok) {
                    showAlert('✅ Все пользователи удалены!', 'success');
                    loadUsers();
                } else {
                    const data = await res.json();
                    showAlert(data.detail || 'Ошибка очистки', 'error');
                }
            } catch (e) {
                showAlert('Ошибка сети', 'error');
            }
        }

        function showAlert(message, type) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            document.body.appendChild(alert);
            setTimeout(() => {
                if (alert) alert.remove();
            }, 2500);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('addForm').addEventListener('submit', addUser);
        document.getElementById('limitSelect').addEventListener('change', (e) => {
            currentLimit = parseInt(e.target.value);
            currentPage = 1;
            loadUsers();
        });

        loadUsers();
    </script>
</body>
</html>
