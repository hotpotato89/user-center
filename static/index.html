<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Center - Управление пользователями</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Glassmorphism карточки */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: white;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
        }

        /* Формы */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: white;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            background: white;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        button.danger {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        button.success {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        /* Таблица */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: white;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        th {
            background: rgba(255, 255, 255, 0.2);
            font-weight: 600;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Пагинация */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .page-btn {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .page-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        /* Алерты */
        .alert {
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .alert-success {
            background: #4caf50;
            color: white;
        }

        .alert-error {
            background: #f44336;
            color: white;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Секции */
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .two-columns {
                grid-template-columns: 1fr;
            }
            .pagination {
                gap: 5px;
            }
            .page-btn {
                padding: 5px 10px;
                font-size: 12px;
            }
        }

        .stats {
            color: white;
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.8;
        }

        .delete-icon {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-icon:hover {
            background: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glass">
            <h1>👥 User Center</h1>
            <p class="subtitle">Управление пользователями | FastAPI + PostgreSQL</p>
        </div>

        <div class="two-columns">
            <!-- Левая колонка: Добавление пользователя -->
            <div class="glass">
                <h2>➕ Добавить пользователя</h2>
                <form id="addUserForm">
                    <div class="form-group">
                        <label>Имя</label>
                        <input type="text" id="userName" required minlength="1" maxlength="60">
                    </div>
                    <div class="form-group">
                        <label>Возраст</label>
                        <input type="number" id="userAge" required min="1" max="120">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="userEmail" required maxlength="45">
                    </div>
                    <button type="submit" class="success">➕ Добавить</button>
                </form>
            </div>

            <!-- Правая колонка: Админ-действия -->
            <div class="glass">
                <h2>🔐 Админ-панель</h2>
                <div class="form-group">
                    <label>Админ-пароль</label>
                    <input type="password" id="adminPassword" placeholder="Введите пароль">
                </div>
                <button onclick="clearAllUsers()" class="danger">🗑️ Очистить всех пользователей</button>
            </div>
        </div>

        <!-- Список пользователей -->
        <div class="glass">
            <h2>📋 Список пользователей</h2>
            <div class="stats" id="stats"></div>
            <div class="table-wrapper">
                <table id="usersTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Имя</th>
                            <th>Возраст</th>
                            <th>Email</th>
                            <th>Дата регистрации</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="usersBody">
                        <tr><td colspan="6">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let currentLimit = 10;

        async function loadUsers() {
            try {
                const response = await fetch(`/users?limit=${currentLimit}&page=${currentPage}`);
                const data = await response.json();
                
                if (data.success) {
                    renderUsers(data.data);
                    renderPagination(data);
                    document.getElementById('stats').innerHTML = `📊 Всего: ${data.total} пользователей | Страница ${data.page} из ${data.total_pages} | Показано ${data.data.length}`;
                } else {
                    showAlert(data.message, 'error');
                }
            } catch (error) {
                showAlert('Ошибка загрузки пользователей', 'error');
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('usersBody');
            if (!users || users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">Нет пользователей</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${escapeHtml(user.name)}</td>
                    <td>${user.age}</td>
                    <td>${escapeHtml(user.email)}</td>
                    <td>${new Date(user.reg_time).toLocaleString()}</td>
                    <td><button class="delete-icon" onclick="deleteUser(${user.id})">🗑️</button></td>
                </tr>
            `).join('');
        }

        function renderPagination(data) {
            const pagination = document.getElementById('pagination');
            if (data.total_pages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let pages = [];
            const maxVisible = 5;
            let start = Math.max(1, data.page - Math.floor(maxVisible / 2));
            let end = Math.min(data.total_pages, start + maxVisible - 1);
            
            if (end - start < maxVisible - 1) {
                start = Math.max(1, end - maxVisible + 1);
            }

            if (start > 1) {
                pages.push({ page: 1, label: '«' });
                if (start > 2) pages.push({ page: null, label: '...' });
            }

            for (let i = start; i <= end; i++) {
                pages.push({ page: i, label: i.toString() });
            }

            if (end < data.total_pages) {
                if (end < data.total_pages - 1) pages.push({ page: null, label: '...' });
                pages.push({ page: data.total_pages, label: '»' });
            }

            pagination.innerHTML = pages.map(p => 
                `<div class="page-btn ${p.page === data.page ? 'active' : ''}" 
                      onclick="goToPage(${p.page})">
                    ${p.label}
                </div>`
            ).join('');
        }

        function goToPage(page) {
            if (page && page !== currentPage) {
                currentPage = page;
                loadUsers();
            }
        }

        async function addUser(event) {
            event.preventDefault();
            
            const name = document.getElementById('userName').value;
            const age = parseInt(document.getElementById('userAge').value);
            const email = document.getElementById('userEmail').value;

            try {
                const response = await fetch('/add_user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, age, email })
                });
                
                const data = await response.json();
                if (response.ok) {
                    showAlert('✅ Пользователь добавлен!', 'success');
                    document.getElementById('addUserForm').reset();
                    loadUsers();
                } else {
                    showAlert(data.detail || data.message || 'Ошибка добавления', 'error');
                }
            } catch (error) {
                showAlert('Ошибка сети', 'error');
            }
        }

        async function deleteUser(id) {
            const password = document.getElementById('adminPassword').value;
            if (!password) {
                showAlert('Введите админ-пароль', 'error');
                return;
            }

            if (!confirm(`Удалить пользователя ID ${id}?`)) return;

            try {
                const response = await fetch(`/delete_user?user_id=${id}&password=${password}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    showAlert('✅ Пользователь удалён!', 'success');
                    loadUsers();
                } else {
                    const data = await response.json();
                    showAlert(data.detail || 'Ошибка удаления', 'error');
                }
            } catch (error) {
                showAlert('Ошибка сети', 'error');
            }
        }

        async function clearAllUsers() {
            const password = document.getElementById('adminPassword').value;
            if (!password) {
                showAlert('Введите админ-пароль', 'error');
                return;
            }

            if (!confirm('⚠️ Очистить всех пользователей? Это действие необратимо!')) return;

            try {
                const response = await fetch(`/clear?password=${password}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    showAlert('✅ База данных очищена!', 'success');
                    loadUsers();
                } else {
                    const data = await response.json();
                    showAlert(data.detail || 'Ошибка очистки', 'error');
                }
            } catch (error) {
                showAlert('Ошибка сети', 'error');
            }
        }

        function showAlert(message, type) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = message;
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('addUserForm').addEventListener('submit', addUser);

        // Выбор лимита
        const limitSelect = document.createElement('select');
        limitSelect.style.cssText = 'margin-left: 10px; padding: 5px; border-radius: 5px;';
        limitSelect.innerHTML = `
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="25">25</option>
            <option value="50">50</option>
        `;
        limitSelect.onchange = () => {
            currentLimit = parseInt(limitSelect.value);
            currentPage = 1;
            loadUsers();
        };
        document.querySelector('.stats').appendChild(limitSelect);

        loadUsers();
    </script>
</body>
</html>
