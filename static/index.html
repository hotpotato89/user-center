<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 10px;
            color: #333;
        }

        h2 {
            margin-bottom: 15px;
            color: #555;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #0056b3;
        }

        button.danger {
            background: #dc3545;
        }

        button.danger:hover {
            background: #c82333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
        }

        .pagination {
            display: flex;
            gap: 5px;
            margin-top: 20px;
            justify-content: center;
        }

        .page-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .page-btn.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        .alert {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 6px;
            color: white;
            z-index: 1000;
        }

        .alert-success {
            background: #28a745;
        }

        .alert-error {
            background: #dc3545;
        }

        .stats {
            margin-bottom: 15px;
            color: #666;
            font-size: 14px;
        }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .two-columns {
                grid-template-columns: 1fr;
            }
        }

        .delete-btn {
            background: #dc3545;
            padding: 5px 10px;
            font-size: 12px;
        }

        .delete-btn:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>👥 User Center</h1>
            <p>Управление пользователями | FastAPI + PostgreSQL</p>
        </div>

        <div class="two-columns">
            <div class="card">
                <h2>➕ Добавить пользователя</h2>
                <form id="addForm">
                    <div class="form-group">
                        <label>Имя</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label>Возраст</label>
                        <input type="number" id="age" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <button type="submit">Добавить</button>
                </form>
            </div>

            <div class="card">
                <h2>🔐 Админ</h2>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="adminPassword" placeholder="Админ-пароль">
                </div>
                <button onclick="clearAll()" class="danger">Очистить всех</button>
            </div>
        </div>

        <div class="card">
            <h2>📋 Пользователи</h2>
            <div class="stats" id="stats"></div>
            <div style="margin-bottom: 10px;">
                <label>Показывать: </label>
                <select id="limitSelect" onchange="changeLimit()">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                </select>
            </div>
            <div id="usersList"></div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let currentLimit = 10;

        async function loadUsers() {
            try {
                const res = await fetch(`/users?limit=${currentLimit}&page=${currentPage}`);
                const data = await res.json();
                
                if (data.success) {
                    renderUsers(data.data);
                    renderPagination(data);
                    document.getElementById('stats').innerHTML = `📊 Всего: ${data.total} | Страница ${data.page} из ${data.total_pages}`;
                } else {
                    document.getElementById('usersList').innerHTML = '<p>Нет пользователей</p>';
                }
            } catch (e) {
                document.getElementById('usersList').innerHTML = '<p>Ошибка загрузки</p>';
            }
        }

        function renderUsers(users) {
            if (!users || users.length === 0) {
                document.getElementById('usersList').innerHTML = '<p>Нет пользователей</p>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr><th>ID</th><th>Имя</th><th>Возраст</th><th>Email</th><th>Действия</th></tr>
                    </thead>
                    <tbody>
            `;

            users.forEach(user => {
                html += `
                    <tr>
                        <td>${user.id}</td>
                        <td>${escapeHtml(user.name)}</td>
                        <td>${user.age}</td>
                        <td>${escapeHtml(user.email)}</td>
                        <td><button class="delete-btn" onclick="deleteUser(${user.id})">Удалить</button></td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            document.getElementById('usersList').innerHTML = html;
        }

        function renderPagination(data) {
            if (data.total_pages <= 1) {
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            let html = '';
            for (let i = 1; i <= Math.min(data.total_pages, 10); i++) {
                html += `<div class="page-btn ${i === data.page ? 'active' : ''}" onclick="goToPage(${i})">${i}</div>`;
            }
            document.getElementById('pagination').innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            loadUsers();
        }

        function changeLimit() {
            currentLimit = parseInt(document.getElementById('limitSelect').value);
            currentPage = 1;
            loadUsers();
        }

        async function addUser(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            const age = parseInt(document.getElementById('age').value);
            const email = document.getElementById('email').value;

            try {
                const res = await fetch('/add_user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, age, email })
                });
                
                if (res.ok) {
                    showAlert('✅ Добавлено!', 'success');
                    document.getElementById('addForm').reset();
                    loadUsers();
                } else {
                    const data = await res.json();
                    showAlert(data.detail || 'Ошибка', 'error');
                }
            } catch (e) {
                showAlert('Ошибка сети', 'error');
            }
        }

        async function deleteUser(id) {
            const password = document.getElementById('adminPassword').value;
            if (!password) {
                showAlert('Введите пароль', 'error');
                return;
            }

            if (!confirm(`Удалить пользователя ${id}?`)) return;

            try {
                const res = await fetch('/delete_user', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, password: password })
                });
                
                if (res.ok) {
                    showAlert('✅ Удалено!', 'success');
                    loadUsers();
                } else {
                    const data = await res.json();
                    showAlert(data.detail || 'Ошибка', 'error');
                }
            } catch (e) {
                showAlert('Ошибка сети', 'error');
            }
        }

        async function clearAll() {
            const password = document.getElementById('adminPassword').value;
            if (!password) {
                showAlert('Введите пароль', 'error');
                return;
            }

            if (!confirm('Очистить всех пользователей?')) return;

            try {
                const res = await fetch('/clear', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password })
                });
                
                if (res.ok) {
                    showAlert('✅ Очищено!', 'success');
                    loadUsers();
                } else {
                    const data = await res.json();
                    showAlert(data.detail || 'Ошибка', 'error');
                }
            } catch (e) {
                showAlert('Ошибка сети', 'error');
            }
        }

        function showAlert(msg, type) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = msg;
            document.body.appendChild(alert);
            setTimeout(() => alert.remove(), 2000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('addForm').addEventListener('submit', addUser);
        loadUsers();
    </script>
</body>
</html>
